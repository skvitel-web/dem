<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Вход — Речной транспорт</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="page">
    <div data-trail='[{"href":"/","label":"Главная"},{"label":"Вход"}]'></div>
    <div class="card" style="max-width: 420px; margin: 2rem auto;">
      <p class="logo">Речной транспорт</p>
      <h1>Вход</h1>
      <p class="subtitle">Логин: e-mail или <strong>Admin26</strong> для администратора</p>
      <div id="loginAlert" class="alert alert-error" style="display:none;" role="alert"></div>
      <form id="loginForm" class="form-grid" novalidate>
        <div>
          <label for="email">Логин (e-mail)</label>
          <input id="email" name="email" required autocomplete="username">
        </div>
        <div>
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
      </form>
      <p style="margin-top:1rem;">Нет аккаунта? <a href="/register.html">Регистрация</a> · <a href="/">На главную</a></p>
    </div>
  </main>
  <script src="/js/breadcrumbs.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("loginAlert");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      try {
        const res = await API.login({
          email: form.email.value.trim(),
          password: form.password.value,
        });
        const role = res.data?.role || "";
        if (role === "ROLE_ADMIN") {
          window.location.href = "/admin.html";
        } else {
          window.location.href = "/profile.html";
        }
      } catch (err) {
        alertBox.textContent = err.body?.message || err.message || "Неверный логин или пароль";
        alertBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
